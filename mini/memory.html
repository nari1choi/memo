<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>짝꿍 찾기 — 메모리 카드 게임</title>
  <style>
    :root {
      --pink: #ff8fb1;
      --pink-soft: #ffe3ec;
      --sky: #cfe9ff;
      --cream: #fff8ec;
      --mint: #7fd8a6;
      --text: #4a3f55;
      --muted: #8a7f96;
      --white: #ffffff;
      --shadow: 0 6px 18px rgba(196, 120, 150, .18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--cream) 0%, var(--pink-soft) 50%, var(--sky) 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 56px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }

    .pill {
      border: 2px solid var(--pink);
      border-radius: 999px;
      background: var(--white);
      color: var(--pink);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      padding: 8px 18px;
      cursor: pointer;
      transition: background .15s, color .15s, transform .1s;
    }
    .pill:hover { transform: translateY(-1px); }
    .pill:active { transform: translateY(1px); }
    .pill[aria-pressed="true"],
    .pill.primary { background: var(--pink); color: var(--white); }
    .pill:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

    .levels {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 24px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px 20px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px 14px 10px 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .75);
      box-shadow: var(--shadow);
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .status b { color: var(--text); font-variant-numeric: tabular-nums; }

    /* Board */
    .board {
      --cols: 4;
      display: grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      gap: clamp(8px, 2vw, 14px);
      width: min(100%, calc(var(--cols) * 112px));
    }

    .card {
      aspect-ratio: 3 / 4;
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      perspective: 800px;
      font: inherit;
    }
    .card:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; border-radius: 16px; }

    .inner {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .45s cubic-bezier(.3, 1.4, .5, 1);
    }
    .card.flipped .inner,
    .card.matched .inner { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 16px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: var(--shadow);
    }
    .back {
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .55) 0 10%, transparent 11%),
        linear-gradient(145deg, #ffb3c9, var(--pink));
      color: var(--white);
      font-size: clamp(18px, 5vw, 28px);
      border: 3px solid var(--white);
    }
    .front {
      background: var(--white);
      transform: rotateY(180deg);
      font-size: clamp(28px, 8vw, 48px);
      border: 3px solid var(--pink-soft);
    }
    .card.matched { cursor: default; }
    .card.matched .front {
      border-color: var(--mint);
      animation: bounce .5s ease;
    }
    @keyframes bounce {
      0%, 100% { transform: rotateY(180deg) scale(1); }
      45% { transform: rotateY(180deg) scale(1.12); }
    }

    /* Done modal */
    .modal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(74, 63, 85, .3);
      backdrop-filter: blur(3px);
    }
    .modal[hidden] { display: none; }
    .dialog {
      width: min(100%, 340px);
      padding: 36px 28px 28px;
      border-radius: 28px;
      background: var(--white);
      text-align: center;
      box-shadow: 0 20px 50px rgba(74, 63, 85, .25);
      animation: pop .35s cubic-bezier(.3, 1.5, .5, 1);
    }
    .dialog .big { font-size: 56px; line-height: 1; margin-bottom: 12px; }
    .dialog h2 { font-size: 24px; margin-bottom: 8px; }
    .dialog p { color: var(--muted); margin-bottom: 24px; }
    @keyframes pop { from { transform: scale(.8); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .inner { transition-duration: .01s; }
      .card.matched .front, .dialog { animation: none; }
    }
  </style>
</head>
<body>

  <h1>짝꿍 찾기 🧠</h1>

  <div class="levels" role="group" aria-label="난이도">
    <button class="pill" data-level="easy">쉬움 3×4</button>
    <button class="pill" data-level="normal">보통 4×4</button>
    <button class="pill" data-level="hard">어려움 4×5</button>
  </div>

  <div class="status" aria-live="polite">
    <span>시도 <b id="moves">0</b></span>
    <span>찾은 쌍 <b id="pairs">0 / 0</b></span>
    <span>시간 <b id="time">0</b>초</span>
    <button class="pill primary" id="restart">다시 시작</button>
  </div>

  <main class="board" id="board"></main>

  <div class="modal" id="modal" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="done-title">
      <div class="big">🎉</div>
      <h2 id="done-title">모두 찾았어요!</h2>
      <p id="done-text"></p>
      <button class="pill primary" id="again">한 판 더</button>
    </div>
  </div>

  <script>
    const EMOJIS = ['🐶', '🐱', '🐰', '🦊', '🐼', '🐸', '🐥', '🦄', '🍓', '🍑', '🍋', '🍉', '🐻', '🐧'];
    const LEVELS = {
      easy:   { cols: 4, pairs: 6 },
      normal: { cols: 4, pairs: 8 },
      hard:   { cols: 5, pairs: 10 },
    };
    const MISMATCH_DELAY = 800;

    const board = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const pairsEl = document.getElementById('pairs');
    const timeEl = document.getElementById('time');
    const modal = document.getElementById('modal');
    const levelButtons = document.querySelectorAll('[data-level]');

    let level = 'normal';
    let open = [];       // up to two face-up, unmatched cards
    let lock = false;
    let moves = 0;
    let found = 0;
    let seconds = 0;
    let timer = null;
    let pendingFlipBack = null;  // flip-back or done-modal timeout, cleared on restart

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function stopTimer() {
      clearInterval(timer);
      timer = null;
    }

    function updateStatus() {
      movesEl.textContent = moves;
      pairsEl.textContent = `${found} / ${LEVELS[level].pairs}`;
      timeEl.textContent = seconds;
    }

    function labelFor(card, index) {
      const state = card.classList.contains('matched') ? '맞춤'
        : card.classList.contains('flipped') ? '뒤집힘' : '덮임';
      const shown = state === '덮임' ? '' : `: ${card.dataset.emoji}`;
      card.setAttribute('aria-label', `카드 ${index + 1}, ${state}${shown}`);
    }

    function startGame(nextLevel = level) {
      level = nextLevel;
      const { cols, pairs } = LEVELS[level];

      stopTimer();
      clearTimeout(pendingFlipBack);
      open = [];
      lock = false;
      moves = 0;
      found = 0;
      seconds = 0;
      modal.hidden = true;

      levelButtons.forEach(b => b.setAttribute('aria-pressed', b.dataset.level === level));

      const picks = shuffle([...EMOJIS]).slice(0, pairs);
      const deck = shuffle([...picks, ...picks]);

      board.style.setProperty('--cols', cols);
      board.innerHTML = '';
      deck.forEach((emoji, i) => {
        const card = document.createElement('button');
        card.className = 'card';
        card.dataset.emoji = emoji;
        card.innerHTML = `<span class="inner"><span class="face back" aria-hidden="true">?</span><span class="face front" aria-hidden="true">${emoji}</span></span>`;
        card.addEventListener('click', () => flip(card));
        labelFor(card, i);
        board.appendChild(card);
      });

      updateStatus();
    }

    function flip(card) {
      if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      if (!timer) {
        timer = setInterval(() => { seconds++; updateStatus(); }, 1000);
      }

      card.classList.add('flipped');
      labelFor(card, [...board.children].indexOf(card));
      open.push(card);
      if (open.length < 2) return;

      moves++;
      const [a, b] = open;
      open = [];

      if (a.dataset.emoji === b.dataset.emoji) {
        [a, b].forEach(c => {
          c.classList.replace('flipped', 'matched');
          labelFor(c, [...board.children].indexOf(c));
        });
        found++;
        updateStatus();
        if (found === LEVELS[level].pairs) finish();
      } else {
        lock = true;
        updateStatus();
        pendingFlipBack = setTimeout(() => {
          [a, b].forEach(c => {
            c.classList.remove('flipped');
            labelFor(c, [...board.children].indexOf(c));
          });
          lock = false;
        }, MISMATCH_DELAY);
      }
    }

    function finish() {
      stopTimer();
      document.getElementById('done-text').textContent = `시도 ${moves}번, ${seconds}초 만에 성공!`;
      pendingFlipBack = setTimeout(() => {
        modal.hidden = false;
        document.getElementById('again').focus();
      }, 500);
    }

    levelButtons.forEach(b => b.addEventListener('click', () => startGame(b.dataset.level)));
    document.getElementById('restart').addEventListener('click', () => startGame());
    document.getElementById('again').addEventListener('click', () => startGame());

    startGame('normal');
  </script>
</body>
</html>
