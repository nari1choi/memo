<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Figma 변수 (Colors / Spacing) */
  :root {
    --color-primary: #3182f6;
    --surface-page: #f2f4f6;
    --surface-card: #ffffff;
    --text-primary: #191f28;
    --text-secondary: #4e5968;
    --text-muted: #8b95a1;
    --text-on-primary: #ffffff;
    --label-blue-soft: #e8f3ff;
    --label-green-soft: #e3f8ec;
    --label-orange-soft: #fff1e5;
    --label-pink-soft: #ffeaf1;

    --space-4: 4px;
    --space-8: 8px;
    --space-12: 12px;
    --space-16: 16px;
    --space-20: 20px;
    --space-24: 24px;
    --space-34: 34px;
    --space-64: 64px;

    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-xl: 24px;
    --radius-full: 999px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--surface-page); }

  body {
    font-family: "Noto Sans KR", sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* Figma 텍스트 스타일 */
  .caption-md { font-weight: 500; font-size: 15px; line-height: 22px; letter-spacing: -0.2px; }
  .heading-xl { font-weight: 700; font-size: 28px; line-height: 38px; letter-spacing: -0.8px; }
  .label-md   { font-weight: 700; font-size: 15px; line-height: 22px; letter-spacing: -0.2px; }
  .title-md   { font-weight: 700; font-size: 17px; line-height: 24px; letter-spacing: -0.3px; }
  .body-sm    { font-weight: 400; font-size: 14px; line-height: 20px; letter-spacing: -0.1px; }
  .caption-sm { font-weight: 500; font-size: 13px; line-height: 18px; letter-spacing: 0; }
  .button-md  { font-weight: 700; font-size: 17px; line-height: 24px; letter-spacing: -0.2px; }

  /* 완성 예시/Home */
  .screen {
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
    width: 100%;
    max-width: 390px;
    min-height: 100dvh;
    margin: 0 auto;
    padding: var(--space-64) var(--space-16) var(--space-34);
    background: var(--surface-page);
  }

  .main {
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
    flex: 1 0 0;
  }

  .header {
    display: flex;
    flex-direction: column;
    gap: var(--space-8);
    padding: 0 var(--space-8);
  }
  .header .date { color: var(--text-muted); }
  .header .count { color: var(--color-primary); }

  /* Filter / Chip */
  .filter {
    display: flex;
    gap: var(--space-8);
    padding: 0 var(--space-4);
  }
  .chip {
    display: flex;
    align-items: center;
    height: 36px;
    padding: 0 var(--space-16);
    border-radius: var(--radius-full);
    background: var(--surface-card);
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .chip[aria-pressed="true"] {
    background: var(--color-primary);
    color: var(--text-on-primary);
  }

  /* Content 카드 */
  .card {
    display: flex;
    flex-direction: column;
    padding: var(--space-8) 0;
    border-radius: var(--radius-xl);
    background: var(--surface-card);
  }

  /* Card/Header */
  .card-header {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    height: 40px;
    padding: var(--space-12) var(--space-16) var(--space-4) var(--space-20);
  }
  .card-header .title { flex: 1 0 0; min-width: 0; }
  .card-header .action {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    color: var(--text-muted);
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
  }
  .icon { flex-shrink: 0; }

  /* Memo/Item */
  .memo-list { list-style: none; }
  .memo-item {
    display: flex;
    align-items: center;
    gap: var(--space-16);
    width: 100%;
    height: 72px;
    padding: var(--space-12) var(--space-20);
    text-align: left;
    text-decoration: none;
    color: inherit;
  }
  .memo-item .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: var(--radius-sm);
  }
  .tile.blue   { background: var(--label-blue-soft); }
  .tile.green  { background: var(--label-green-soft); }
  .tile.orange { background: var(--label-orange-soft); }
  .tile.pink   { background: var(--label-pink-soft); }
  .memo-item .content {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
    flex: 1 0 0;
    min-width: 0;
  }
  .memo-item .content .title { color: var(--text-primary); }
  .memo-item .content .preview {
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .memo-item .date {
    flex-shrink: 0;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* Button/Primary — 화면 아래에 붙어 있음 */
  .button-primary {
    position: sticky;
    bottom: var(--space-34);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-8);
    width: 100%;
    height: 56px;
    padding: 0 var(--space-24);
    border-radius: var(--radius-md);
    background: var(--color-primary);
    color: var(--text-on-primary);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="screen">
  <main class="main">
    <header class="header">
      <p class="date caption-md">10월 30일 금요일</p>
      <h1 class="heading-xl">오늘까지 메모를<br><span class="count">128개</span> 남겼어요</h1>
    </header>

    <nav class="filter" aria-label="분류">
      <button class="chip label-md" type="button" aria-pressed="true">전체</button>
      <button class="chip label-md" type="button" aria-pressed="false">업무</button>
      <button class="chip label-md" type="button" aria-pressed="false">개인</button>
      <button class="chip label-md" type="button" aria-pressed="false">아이디어</button>
    </nav>

    <section class="card" aria-labelledby="pinned-title">
      <div class="card-header">
        <svg class="icon" preserveAspectRatio="none" overflow="visible" style="display: block;" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Icon/Pin">
<path id="Shape" d="M6 2.33333H10L9.4 5.8L11.3333 8H4.66667L6.6 5.8L6 2.33333Z" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round" stroke="#3182F6"/>
<path id="Shape_2" d="M8 8V13.3333" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round" stroke="#3182F6"/>
</g>
</svg>
        <h2 id="pinned-title" class="title label-md">고정한 메모</h2>
      </div>
      <ul class="memo-list">
        <li>
          <a class="memo-item" href="#">
            <span class="tile blue">
              <svg class="icon" preserveAspectRatio="none" overflow="visible" style="display: block;" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Icon/Note">
<path id="Shape" d="M6.41667 3.66667H12.8333L16.5 7.33333V18.3333H6.41667V3.66667Z" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="#3182F6"/>
<path id="Shape_2" d="M12.8333 3.66667V7.33333H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="#3182F6"/>
</g>
</svg>
            </span>
            <span class="content">
              <span class="title title-md">디자인 리뷰 회의록</span>
              <span class="preview body-sm">검수 기준과 다음 할 일 정리</span>
            </span>
            <span class="date caption-sm">오늘</span>
          </a>
        </li>
        <li>
          <a class="memo-item" href="#">
            <span class="tile green">
              <svg class="icon" preserveAspectRatio="none" overflow="visible" style="display: block;" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Icon/Note">
<path id="Shape" d="M6.41667 3.66667H12.8333L16.5 7.33333V18.3333H6.41667V3.66667Z" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="#12A150"/>
<path id="Shape_2" d="M12.8333 3.66667V7.33333H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="#12A150"/>
</g>
</svg>
            </span>
            <span class="content">
              <span class="title title-md">주말 등산 준비</span>
              <span class="preview body-sm">물 두 병, 간식, 바람막이 챙기기</span>
            </span>
            <span class="date caption-sm">어제</span>
          </a>
        </li>
      </ul>
    </section>

    <section class="card" aria-labelledby="recent-title">
      <div class="card-header">
        <h2 id="recent-title" class="title label-md">최근 메모</h2>
        <a class="action label-md" href="#">
          전체 보기
          <svg class="icon" preserveAspectRatio="none" overflow="visible" style="display: block;" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Icon/ChevronRight">
<path id="Shape" d="M6 4L10 8L6 12" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round" stroke="#8B95A1"/>
</g>
</svg>
        </a>
      </div>
      <ul class="memo-list">
        <li>
          <a class="memo-item" href="#">
            <span class="tile pink">
              <svg class="icon" preserveAspectRatio="none" overflow="visible" style="display: block;" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Icon/Note">
<path id="Shape" d="M6.41667 3.66667H12.8333L16.5 7.33333V18.3333H6.41667V3.66667Z" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="#E5397A"/>
<path id="Shape_2" d="M12.8333 3.66667V7.33333H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="#E5397A"/>
</g>
</svg>
            </span>
            <span class="content">
              <span class="title title-md">장보기 목록</span>
              <span class="preview body-sm">우유, 계란, 사과, 커피 원두</span>
            </span>
            <span class="date caption-sm">오늘</span>
          </a>
        </li>
        <li>
          <a class="memo-item" href="#">
            <span class="tile orange">
              <svg class="icon" preserveAspectRatio="none" overflow="visible" style="display: block;" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Icon/Note">
<path id="Shape" d="M6.41667 3.66667H12.8333L16.5 7.33333V18.3333H6.41667V3.66667Z" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="#F76808"/>
<path id="Shape_2" d="M12.8333 3.66667V7.33333H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="#F76808"/>
</g>
</svg>
            </span>
            <span class="content">
              <span class="title title-md">앱 아이콘 아이디어</span>
              <span class="preview body-sm">메모지 모서리가 접힌 모양</span>
            </span>
            <span class="date caption-sm">오늘</span>
          </a>
        </li>
        <li>
          <a class="memo-item" href="#">
            <span class="tile green">
              <svg class="icon" preserveAspectRatio="none" overflow="visible" style="display: block;" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Icon/Note">
<path id="Shape" d="M6.41667 3.66667H12.8333L16.5 7.33333V18.3333H6.41667V3.66667Z" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="#12A150"/>
<path id="Shape_2" d="M12.8333 3.66667V7.33333H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="#12A150"/>
</g>
</svg>
            </span>
            <span class="content">
              <span class="title title-md">읽을 책</span>
              <span class="preview body-sm">디자인 시스템 책 두 권</span>
            </span>
            <span class="date caption-sm">어제</span>
          </a>
        </li>
      </ul>
    </section>
  </main>

  <button class="button-primary button-md" type="button">
    <svg class="icon" preserveAspectRatio="none" overflow="visible" style="display: block;" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Icon/Plus">
<path id="Shape" d="M10 4.16667V10M10 10V15.8333M10 10H4.16667M10 10H15.8333" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round" stroke="white"/>
</g>
</svg>
    새 메모 쓰기
  </button>
</div>

<script>
  // Chip: 고른 칩 하나만 Selected
  const chips = document.querySelectorAll('.chip');
  chips.forEach(chip => chip.addEventListener('click', () => {
    chips.forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
  }));
</script>
</body>
</html>
